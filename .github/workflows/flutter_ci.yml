name: Flutter CI/CD DevSecOps

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_scan:
    name: DevSecOps Security Audit & SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false

      - name: Filesystem Security Vulnerability Scanning (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: false
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Dependency Security Audit
        run: flutter pub outdated

      - name: SAST Static Security Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

  test_suite:
    name: Automated Unit & Scenario Tests
    needs: security_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run All Tests
        run: flutter test

  build_release:
    name: Build Hardened Release Artifacts
    needs: [security_scan, test_suite]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Environment Configuration (.env.json)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CONFIRM_EMAIL_ENABLED: "true"
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Error: SUPABASE_URL secret is missing or empty. Please set SUPABASE_URL in GitHub repository secrets." >&2
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_ANON_KEY secret is missing or empty. Please set SUPABASE_ANON_KEY in GitHub repository secrets." >&2
            exit 1
          fi
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_ANON_KEY" \
            --arg confirm "$CONFIRM_EMAIL_ENABLED" \
            '{"SUPABASE_URL": $url, "SUPABASE_ANON_KEY": $key, "CONFIRM_EMAIL_ENABLED": $confirm}' > .env.json

      - name: Build Obfuscated Release APK
        run: flutter build apk --release --dart-define-from-file=.env.json

      - name: Build Obfuscated Release App Bundle
        run: flutter build appbundle --release --dart-define-from-file=.env.json

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ubantu-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ubantu-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
